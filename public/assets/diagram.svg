<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">書籍制作フロー</title>
  <desc id="desc">Markdown、Astro、Vivliostyle、PDFの流れ</desc>
  <rect width="900" height="260" fill="#f3f0e8"/>
  <g font-family="sans-serif" font-size="24" text-anchor="middle" fill="#202522">
    <rect x="35" y="85" width="170" height="90" rx="12" fill="#fff" stroke="#52717a" stroke-width="3"/>
    <text x="120" y="140">Markdown</text>
    <path d="M215 130h75" stroke="#52717a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="85" width="170" height="90" rx="12" fill="#fff" stroke="#52717a" stroke-width="3"/>
    <text x="385" y="140">Astro HTML</text>
    <path d="M480 130h75" stroke="#52717a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="565" y="85" width="170" height="90" rx="12" fill="#fff" stroke="#52717a" stroke-width="3"/>
    <text x="650" y="140">Vivliostyle</text>
    <path d="M745 130h75" stroke="#52717a" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="830" y="85" width="55" height="90" rx="12" fill="#fff" stroke="#52717a" stroke-width="3"/>
    <text x="857" y="140" font-size="18">PDF</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0L9 3L0 6Z" fill="#52717a"/>
    </marker>
  </defs>
</svg>
